# Bắt lỗi trước khi tag cho JitPack: build release AAR, chạy unit test, và publishToMavenLocal đúng
# lệnh JitPack sẽ chạy (xem jitpack.yml). Lỗi POM/coordinate lộ ở đây thay vì ở lần resolve đầu
# tiên của app host.
name: ci
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease testDebugUnitTest --console=plain
      - run: ./gradlew publishToMavenLocal -x test --no-configuration-cache --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: freshness-ads-aar
          path: |
            build/outputs/aar/*.aar
            compose/build/outputs/aar/*.aar
